AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  sfn-apigw-example

  Sample SAM Template for sfn-apigw-example

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Parameters:
  PineconeApiKey:
    Type: String
    Description: API Key for Pinecone
  OpenAiApiKey:
    Type: String
    Description: API Key for OpenAI

Resources:
  RoverChatLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: RoverChatLayer
      Description: Dependencies for Mars Rover chatbot
      ContentUri: layers/rover_chat/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.13
      BuildProperties:
        Pipfile: false
        UsePipenv: false
        RequirementsFile: requirements.txt

  RoverChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/rover_chat/
      Handler: app.lambda_handler
      Runtime: python3.13
      Layers:
        - !Ref RoverChatLayer
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            Path: /chat
            Method: POST
            RestApiId: !Ref BasicAWSApiGateway
      Environment:
        Variables:
          PINECONE_API_KEY: !Ref PineconeApiKey
          OPENAI_API_KEY: !Ref OpenAiApiKey
      Policies:
        - Statement:
            - Sid: ddbPolicy
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: "*"

  GetLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get_logs/
      Handler: app.lambda_handler
      Runtime: python3.13
      Layers:
        - !Ref RoverChatLayer
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            Path: /logs
            Method: GET
            RestApiId: !Ref BasicAWSApiGateway
      Policies:
        - Statement:
            - Sid: ddbPolicy
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: "*"
            - Sid: s3Policy
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: "*"

  ChatHistoryTable:
    Type: AWS::Serverless::SimpleTable # More info about SimpleTable Resource: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-simpletable.html
    Properties:
      TableName: ChatHistoryTable
      PrimaryKey:
        Name: SessionId
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  BasicAWSApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: Basic AWS Api Gateway
      StageName: prod
      Auth:
        DefaultAuthorizer: AWS_IAM

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${BasicAWSApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/"
